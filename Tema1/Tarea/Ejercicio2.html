<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio2</title>
</head>
<body>
    <h1>Ejercicio2: Cambio de imágenes </h1>
    <img  id="" onclick="cambiaImg()" src="" alt="Foto" width="400" height="450">
    <p>Haz click sobre la foto para cambiar la foto.</p>

    <script>
        var imagenes = ["", "", "", ""];
        var posicion = 0;

         function cambiaImg() {
            var image = document.getElementById("");
            posicion = posicion + 1;
            if (posicion == imagenes.length) {
                posicion = 0;
            }
            image.src = imagenes[posicion];
        }

    </script>

</body>
</html>
