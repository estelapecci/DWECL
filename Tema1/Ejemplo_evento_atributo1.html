<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tema 2 - Eventos con addEventListener</title>
</head>
<body>

  <h2>Eventos con addEventListener</h2>

  <!-- ========================================== -->
  <!-- EVENTOS DE RATÓN                           -->
  <!-- ========================================== -->

  <!-- Ratón 1: click -->
  <button id="btnClic">1. Hacer clic aquí</button>

  <br><br>

  <!-- Ratón 2: mouseover -->
  <div id="caja" style="background: #e2e8f0; padding: 10px; width: 250px;">
    2. Pasa el ratón por encima de esta caja
  </div>

  <hr>

  <!-- ========================================== -->
  <!-- EVENTOS DE TEXTO / TECLADO                 -->
  <!-- ========================================== -->

  <!-- Texto 1: input (se activa mientras el usuario escribe) -->
  <label for="inputNombre">3. Escribe tu nombre (input):</label><br>
  <input type="text" id="inputNombre">

  <br><br>

  <!-- Texto 2: keyup (se activa al soltar una tecla) -->
  <label for="inputTexto">4. Escribe un texto (keyup):</label><br>
  <input type="text" id="inputTexto">

  <!-- Salida de texto en pantalla -->
  <p id="salida"></p>

  <script>
    var salida = document.getElementById("salida");
    var btnClic = document.getElementById("btnClic");
    var caja = document.getElementById("caja");
    var inputNombre = document.getElementById("inputNombre");
    var inputTexto = document.getElementById("inputTexto");

    // Funciones asociadas a los eventos de ratón
    function alHacerClic() {
      salida.innerText = "¡Has hecho clic en el botón!";
    }

    function alPasarElRaton() {
      caja.innerText = "¡El ratón está sobre la caja!";
    }

    // Funciones asociadas a los eventos de texto
    function alEscribirTexto() {
      salida.innerText = "Nombre en tiempo real: " + inputNombre.value;
    }

    function alSoltarTecla() {
      console.log("Número de caracteres (Consola F12): " + inputTexto.value.length);
    }

    // Registro de listeners
    btnClic.addEventListener("click", alHacerClic);
    caja.addEventListener("mouseover", alPasarElRaton);
    inputNombre.addEventListener("input", alEscribirTexto);
    inputTexto.addEventListener("keyup", alSoltarTecla);
  </script>

</body>
</html>
