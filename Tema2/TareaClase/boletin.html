<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletín de notas - Notas</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    max-width: 860px;
    margin: 0 auto;
    padding: 20px;
  }
  h1 { text-align: center; }
  .panel {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  input, select { padding: 6px; font-size: 15px; border: 1px solid #94a3b8; border-radius: 6px; }
  input[type="number"] { width: 60px; }
  button {
    padding: 7px 12px;
    margin: 4px 2px;
    font-size: 15px;
    cursor: pointer;
  }
  .azul {
    border: none;
    border-radius: 6px;
    background: #1d4ed8;
    color: white;
  }
  .azul:hover { background: #1e40af; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: center; }
  th { background: #e2e8f0; }
  .suspenso { background: #fee2e2; color: #991b1b; }
  .aprobado { background: #dcfce7; color: #166534; }
  #mensaje { font-weight: bold; margin-top: 8px; }
  #resultado {
    background: #0f172a;
    color: #f8fafc;
    padding: 14px;
    border-radius: 8px;
    font-family: Consolas, monospace;
    font-size: 14px;
    white-space: pre-wrap;
    min-height: 20px;
  }
</style>
</head>
<body>

<h1>Boletín de notas de la clase</h1>

<div class="panel">
  <h2>Notas por trimestre</h2>
  <div id="tabla"></div>
</div>

<div class="panel">
  <h2>Añadir alumno</h2>
  Nombre: <input type="text" id="nuevoNombre">
  1T: <input type="number" id="n1" min="0" max="10">
  2T: <input type="number" id="n2" min="0" max="10">
  3T: <input type="number" id="n3" min="0" max="10">
  <button class="azul" onclick="anadirAlumno()">Añadir</button>
  <div id="mensaje"></div>
</div>

<div class="panel">
  <h2>Consultas</h2>
  <button onclick="contarAprobados()">Contar aprobados</button>
  <button onclick="mejorNota()">Mejor nota de la clase</button>
  <button onclick="mediaTrimestre()">Media de un trimestre</button>
  <select id="trimestre">
    <option value="0">1º trimestre</option>
    <option value="1">2º trimestre</option>
    <option value="2">3º trimestre</option>
  </select>
  <br>
  <input type="text" id="buscarNombre" placeholder="Nombre del alumno">
  <button onclick="buscarAlumno()">Buscar alumno</button>

  <h3>Resultado</h3>
  <div id="resultado"></div>
</div>

<script>
  let alumnos = ["Ana", "Luis", "Marta", "Pablo", "Sara"];

  let notas = [
    [7, 8, 9],
    [4, 5, 6],
    [3, 4, 2],
    [9, 10, 9],
    [5, 4, 6]
  ];

  function mediaAlumno(fila) {
    let suma = 0;
    for (let c = 0; c < notas[fila].length; c++) {
      suma = suma + notas[fila][c];
    }
    return suma / notas[fila].length;
  }

  function calificacion(nota) {
    if (nota < 5) {
      return "Insuficiente";
    } else if (nota < 6) {
      return "Suficiente";
    } else if (nota < 7) {
      return "Bien";
    } else if (nota < 9) {
      return "Notable";
    } else {
      return "Sobresaliente";
    }
  }

  function pintarTabla() {
    let html = "<table>";
    html = html + "<tr><th>Alumno</th><th>1T</th><th>2T</th><th>3T</th><th>Media</th><th>Calificación</th></tr>";

    for (let f = 0; f < notas.length; f++) {
      html = html + "<tr>";
      html = html + "<td>" + alumnos[f] + "</td>";

      for (let c = 0; c < notas[f].length; c++) {
        let nota = notas[f][c];
        if (nota >= 5) {
          html = html + "<td class='aprobado'>" + nota + "</td>";
        } else {
          html = html + "<td class='suspenso'>" + nota + "</td>";
        }
      }

      let media = mediaAlumno(f);
      html = html + "<td><b>" + media.toFixed(2) + "</b></td>";
      html = html + "<td>" + calificacion(media) + "</td>";
      html = html + "</tr>";
    }

    html = html + "</table>";
    document.getElementById("tabla").innerHTML = html;
  }

  function anadirAlumno() {
    let nombre = document.getElementById("nuevoNombre").value;
    let n1 = Number(document.getElementById("n1").value);
    let n2 = Number(document.getElementById("n2").value);
    let n3 = Number(document.getElementById("n3").value);

    if (nombre === "") {
      document.getElementById("mensaje").innerHTML = "Error: escribe un nombre.";
      return;
    }
    if (n1 < 0 || n1 > 10 || n2 < 0 || n2 > 10 || n3 < 0 || n3 > 10) {
      document.getElementById("mensaje").innerHTML = "Error: las notas deben estar entre 0 y 10.";
      return;
    }

    alumnos.push(nombre);
    notas.push([n1, n2, n3]);
    document.getElementById("mensaje").innerHTML = "Añadido " + nombre + ". Ahora hay " + alumnos.length + " alumnos.";
    pintarTabla();
  }

  function contarAprobados() {
    let contador = 0;
    for (let f = 0; f < notas.length; f++) {
      if (mediaAlumno(f) >= 5) {
        contador++;
      }
    }
    document.getElementById("resultado").textContent =
      "Alumnos aprobados (media >= 5): " + contador + " de " + alumnos.length;
  }

  function mejorNota() {
    let mejor = notas[0][0];
    let filaMejor = 0;
    let colMejor = 0;

    for (let f = 0; f < notas.length; f++) {
      for (let c = 0; c < notas[f].length; c++) {
        if (notas[f][c] > mejor) {
          mejor = notas[f][c];
          filaMejor = f;
          colMejor = c;
        }
      }
    }
    document.getElementById("resultado").textContent =
      "Mejor nota de la clase: " + mejor + "\n" +
      "Alumno: " + alumnos[filaMejor] + " (" + (colMejor + 1) + "º trimestre)";
  }

  function mediaTrimestre() {
    let col = Number(document.getElementById("trimestre").value);
    let suma = 0;
    for (let f = 0; f < notas.length; f++) {
      suma = suma + notas[f][col];
    }
    let media = suma / notas.length;
    document.getElementById("resultado").textContent =
      "Media del " + (col + 1) + "º trimestre: " + media.toFixed(2) + " (" + calificacion(media) + ")";
  }

  function buscarAlumno() {
    let buscado = document.getElementById("buscarNombre").value.trim().toLowerCase();
    let posicion = -1;

    for (let i = 0; i < alumnos.length; i++) {
      if (alumnos[i].toLowerCase() === buscado) {
        posicion = i;
        break;
      }
    }

    if (posicion === -1) {
      document.getElementById("resultado").textContent = "No se ha encontrado ningún alumno con ese nombre.";
      return;
    }

    let media = mediaAlumno(posicion);
    document.getElementById("resultado").textContent =
      alumnos[posicion] + " está en la posición " + posicion + "\n" +
      "Notas: " + notas[posicion].join(", ") + "\n" +
      "Media: " + media.toFixed(2) + " (" + calificacion(media) + ")";
  }

  pintarTabla();
</script>

</body>
</html>
